[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-rca"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "rich>=13.0.0",
    "langfuse>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlite-vec>=0.1.0",
]

[project.scripts]
triage-rca = "triage_rca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
